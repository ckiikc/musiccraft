[package]
name = "musiccraft"
version = "0.11.0"
edition = "2024"
license = "MIT"
description = "Native music player for local, NAS, FTP and MusicCraft Android libraries"
publish = false

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland"] }
rodio = { version = "=0.22.2", features = ["symphonia-all"] }
cpal = "=0.17.3"

rfd = "=0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
srp = "=0.6.0"
num-bigint = "=0.4.8"
subtle = "=2.6.1"
sha2 = "=0.10.9"
aes-gcm = "=0.10.3"
base64 = "=0.22.1"
lofty = "=0.25.4"
url = "2"
walkdir = "2"
rtrb = "=0.3.5"
symphonia = { version = "=0.5.5", features = ["all"] }
percent-encoding = "2"
rand = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
curl = { version = "=0.4.51", default-features = false, features = ["protocol-ftp", "ssl", "force-system-lib-on-osx"] }
if-addrs = "=0.15.0"
httpdate = "=1.0.3"
unicode-normalization = "=0.1.25"
unicode-bidi = "=0.3.18"
sys-locale = "=0.3.2"
fs2 = "=0.4.3"

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "=0.21.1"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "=3.6.3", features = ["windows-native"] }
wasapi = "=0.23.0"
windows = { version = "=0.62.2", features = ["Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust"] }
alsa = "=0.11.0"
x11rb = { version = "=0.13.2", features = ["randr"] }

[build-dependencies]
winresource = "=0.1.34"
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[dev-dependencies]
ron = "=0.12.2"
tempfile = "3"
hound = "3.5"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSNotification", "NSOperation", "block2"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSScreen", "NSEvent", "NSWindow", "NSResponder", "NSApplication", "NSMenu", "NSMenuItem", "NSCell", "NSPanel", "block2"] }
security-framework = "=3.7.0"
coreaudio-rs = "=0.14.2"
objc2-core-audio = "=0.3.2"
objc2-core-audio-types = "=0.3.2"
