[package]
name = "musiccraft-tags"
version = "0.1.0"
edition = "2024"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
musiccraft-sync = { path = "../musiccraft-sync" }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[dev-dependencies]
tempfile = "3"
