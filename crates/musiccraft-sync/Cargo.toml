[package]
name = "musiccraft-sync"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Preview-only, content-based MusicCraft synchronization planner"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "=0.1.25"
sha2 = "=0.10.9"
rand = "0.9"
walkdir = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
